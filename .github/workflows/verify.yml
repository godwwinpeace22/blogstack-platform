name: Verify launch
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci
      - run: node scripts/check-source.mjs
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run build -w @blogstack/api
      - run: npm run build -w @blogstack/cdn-worker
      - run: npm run build -w @blogstack/link-worker
      - run: npm run build -w @blogstack/ops-worker
      - run: node scripts/check-launch.mjs --static
      - uses: actions/upload-artifact@v4
        with:
          name: launch-builds
          retention-days: 7
          path: |
            blogstack-dashboard/dist
            blogstack-site/dist
            blogstack-docs/out
            blogstack-registry/public
            blogstack-api/dist
            blogstack-cdn-worker/dist
            blogstack-link-worker/dist
            blogstack-ops-worker/dist
            examples/nextjs/.next/BUILD_ID
            examples/nextjs/.next/routes-manifest.json
