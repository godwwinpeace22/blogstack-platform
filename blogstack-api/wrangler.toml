name = "blogstack-app"
account_id = "d37dff02b31097b9581ef596777605dc"
main = "src/index.ts"
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "../blogstack-dashboard/dist"
binding = "DASHBOARD_ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 0.1

[[d1_databases]]
binding = "MAIN_DB"
database_name = "blogstack-db"
database_id = "f56811e5-e2fa-4f0f-9a0b-381daedda240"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "e58f513862c24460ab7b8d8a9537f0c6"

[[kv_namespaces]]
binding = "CDN_CACHE"
id = "b643f37abaaa45afbea68f7d49f6b603"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "blogstack-media"

[[queues.producers]]
binding = "JOB_QUEUE"
queue = "blogstack-jobs"

[[queues.consumers]]
queue = "blogstack-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "blogstack-jobs-dead"

[[services]]
binding = "LINK_SCANNER"
service = "blogstack-link-scanner"

[ai]
binding = "AI"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "blogstack_events"

[[ratelimits]]
name = "EVENT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["* * * * *", "0 * * * *"]

[vars]
CDN_URL = "https://blogstack-cdn.hidden-silence-2d18.workers.dev"
API_URL = "https://blogstack-app.hidden-silence-2d18.workers.dev"
FRONTEND_URL = "https://blogstack-app.hidden-silence-2d18.workers.dev"
EMAIL_FROM = ""
POLAR_SERVER = "sandbox"
CHECKOUT_ENABLED = "false"
SIGNUP_MODE = "closed"
PILOT_EMAILS = ""
CF_ACCOUNT_ID = "d37dff02b31097b9581ef596777605dc"
# Six product IDs are set by scripts/polar-products.mjs after merchant verification.

# Secrets: BETTER_AUTH_SECRET, CDN_SECRET, RESEND_API_KEY,
# POLAR_ACCESS_TOKEN, POLAR_WEBHOOK_SECRET, CF_ANALYTICS_TOKEN
