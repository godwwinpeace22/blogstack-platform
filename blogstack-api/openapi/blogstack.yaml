      type: apiKey
      in: header
      name: X-API-Key
      description: Project API key (format bsk_live_...)
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ProjectSlug:
      name: projectSlug
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions for this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
  schemas:
    Plan:
      type: string
      enum:
        - solo
        - studio
        - growth
      description: Shared billing-account plan. Studio/Growth have unlimited blogs. Canonical prices and allowances
        are returned by /public/plans.
    PostStatus:
      type: string
      enum:
        - draft
        - published
    AccountRole:
      type: string
      enum:
        - account_admin
        - account_editor
      description: |
        - account_admin: manage all projects, invite members (no billing)
        - account_editor: read/write access to all projects, no management
    ProjectRole:
      type: string
      enum:
        - project_admin
        - editor
        - writer
      description: |
        - project_admin: project settings, invite members, publish
        - editor: publish and edit any post in project
        - writer: create and edit own posts only
    User:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: integer
          description: Unix timestamp (seconds)
    Account:
      type: object
      required:
        - id
        - ownerId
        - plan
        - createdAt
      properties:
        id:
          type: string
        ownerId:
          type: string
        plan:
          $ref: "#/components/schemas/Plan"
        createdAt:
          type: integer
        canWrite: *a3
    AccountDetail:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          properties:
            owner:
              $ref: "#/components/schemas/User"
            limits:
              type: object
            usage:
              type: object
            role:
              type:
                - string
                - "null"
            trialEndsAt:
              type:
                - integer
                - "null"
            paidThrough:
              type:
                - integer
                - "null"
    Project:
      type: object
      required:
        - id
        - accountId
        - name
        - slug
        - createdBy
        - createdAt
      properties:
        id:
          type: string
        accountId:
          type: string
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
        createdAt:
          type: integer
        settings:
          $ref: "#/components/schemas/ProjectSettings"
        canWrite: *a3
        canCustomizeBranding: *a3
        role:
          $ref: "#/components/schemas/ProjectRole"
        branding:
          type: object
          properties:
            showAttribution: *a3
            workspaceName: *a1
            logoUrl: &a4
              type:
                - string
                - "null"
    ProjectSettings:
      type: object
      properties:
        ogImage:
          type: string
          format: uri
          nullable: true
        robotsTxt:
          type: string
          nullable: true
          description: Legacy stored preference. Preserve and configure robots in the host website; BlogStack does not
            overwrite it.
        sitemapEnabled:
          type: boolean
          default: true
        rssEnabled:
          type: boolean
          default: true
        blogUrl:
          type: string
          format: uri
          description: Actual website blog URL, HTTPS except localhost. No query or fragment.
        hideAttribution: *a3
        workspaceName: *a1
        logoUrl: *a4
        analyticsEnabled: *a3
    ProjectWithStats:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            postCount:
              type: integer
            memberCount:
              type: integer
            viewCount:
              type: integer
    ProjectStats:
      type: object
      properties:
        postCount:
          type: integer
        publishedCount:
          type: integer
        draftCount:
          type: integer
        scheduledCount:
          type: integer
        memberCount:
          type: integer
        mediaCount:
          type: integer
        totalViews:
          type: integer
        viewsThisMonth:
          type: integer
    Post:
      type: object
      required:
        - id
        - projectId
        - title
        - slug
        - content
        - status
        - authorId
        - createdAt
        - updatedAt
        - revision
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
          description: BlockNote JSON document string
        renderedHtml:
          type: string
          nullable: true
          description: Pre-rendered HTML with Shiki code highlighting. Set on publish.
        status:
          $ref: "#/components/schemas/PostStatus"
        authorId:
          type: string
        publishedAt:
          type: integer
          nullable: true
        scheduledAt:
          type: integer
          nullable: true
        createdAt:
          type: integer
        updatedAt:
          type: integer
        excerpt: *a4
        coverImage: *a4
        seoTitle: *a4
        seoDescription: *a4
        canonicalUrl: *a4
        noIndex: *a3
        primaryKeyword: *a4
        revision: &a5
          type: integer
        publishedRevision: *a5
        hasUnpublishedChanges: *a3
        everPublished: *a3
        tagIds:
          type: array
          items: *a1
    PostWithTags:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          properties:
            tags:
              type: array
              items:
                $ref: "#/components/schemas/Tag"
            author:
              $ref: "#/components/schemas/User"
    PublicPost:
      type: object
      required:
        - id
        - title
        - slug
        - renderedHtml
        - publishedAt
      description: Minimal post shape returned by public endpoints
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        renderedHtml:
          type: string
          description: Full HTML ready to render inside an article element
        publishedAt:
          type: integer
        author:
          type: object
          properties:
            id: *a1
            name: *a4
            avatarUrl: *a4
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        excerpt: *a4
        coverImage: *a4
        readingMinutes:
          type: integer
          minimum: 1
        seoTitle: *a4
        seoDescription: *a4
        canonicalUrl: *a4
        noIndex: *a3
        primaryKeyword: *a4
        updatedAt: *a5
    Media:
      type: object
      required:
        - id
        - projectId
        - key
        - url
        - filename
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        key:
          type: string
          description: R2 object key (e.g. proj_abc/550e8400.jpg)
        url:
          type: string
          format: uri
          description: CDN base URL (blogstack-cdn.hidden-silence-2d18.workers.dev/{projectId}/{key})
        filename:
          type: string
        size:
          type: integer
          nullable: true
          description: File size in bytes
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        mimeType:
          type: string
          nullable: true
        uploadedBy:
          type: string
          nullable: true
        createdAt:
          type: integer
    Tag:
      type: object
      required:
        - id
        - projectId
        - name
        - slug
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        ogImage:
          type: string
          format: uri
          nullable: true
    TagWithCount:
      allOf:
        - $ref: "#/components/schemas/Tag"
        - type: object
          properties:
            postCount:
              type: integer
    AccountMember:
      type: object
      required:
        - accountId
        - userId
        - role
        - invitedAt
      properties:
        accountId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/AccountRole"
        invitedBy:
          type: string
        invitedAt:
          type: integer
        joinedAt:
          type: integer
          nullable: true
        user:
          $ref: "#/components/schemas/User"
    ProjectMember:
      type: object
      required:
        - projectId
        - userId
        - role
        - invitedAt
      properties:
        projectId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        invitedBy:
          type: string
        invitedAt:
          type: integer
        joinedAt:
          type: integer
          nullable: true
        user:
          $ref: "#/components/schemas/User"
    Invitation:
      type: object
      required:
        - id
        - email
        - role
        - token
        - expiresAt
      properties:
        id:
          type: string
        projectId:
          type: string
          nullable: true
        accountId:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
        invitedBy:
          type: string
        token:
          type: string
        expiresAt:
          type: integer
        acceptedAt:
          type: integer
          nullable: true
    InvitationDetail:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          properties:
            projectName:
              type: string
              nullable: true
            accountName:
              type: string
              nullable: true
            inviterName:
              type: string
              nullable: true
    ApiKey:
      type: object
      required:
        - id
        - projectId
        - name
        - keyPrefix
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
          description: First 16 characters for identification
        createdBy:
          type: string
        lastUsedAt:
          type: integer
          nullable: true
        createdAt:
          type: integer
        scopes:
          type: array
          items: *a1
        expiresAt:
          type:
            - integer
            - "null"
        revokedAt:
          type:
            - integer
            - "null"
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9-]+$
          description: URL-safe slug, unique across all projects
        settings:
          $ref: "#/components/schemas/ProjectSettings"
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        settings:
          $ref: "#/components/schemas/ProjectSettings"
    InviteAccountMemberRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AccountRole"
    InviteProjectMemberRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/ProjectRole"
    CreatePostRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          description: Auto-generated from title if omitted
        content:
          type: string
          description: BlockNote JSON string (empty document if omitted)
        tagIds:
          type: array
          items:
            type: string
        excerpt: *a4
        coverImage: *a4
        seoTitle: *a4
        seoDescription: *a4
        canonicalUrl: *a4
        noIndex: *a3
        primaryKeyword: *a4
    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
        content:
          type: string
          description: BlockNote JSON string
        tagIds:
          type: array
          items:
            type: string
        excerpt: *a4
        coverImage: *a4
        seoTitle: *a4
        seoDescription: *a4
        canonicalUrl: *a4
        noIndex: *a3
        primaryKeyword: *a4
        revision:
          type: integer
          minimum: 1
          description: Expected saved draft revision; stale writes return 409.
      required:
        - revision
    CreateTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          description: Auto-generated from name if omitted
        description:
          type: string
          maxLength: 500
        ogImage:
          type: string
          format: uri
    UpdateTagRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
        description:
          type: string
          maxLength: 500
        ogImage:
          type: string
          format: uri
    PaginatedPosts:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
        nextCursor:
          type: string
          nullable: true
    PaginatedPublicPosts:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicPost"
        total:
          type: integer
        nextCursor:
          type: string
          nullable: true
    PaginatedMedia:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        total:
          type: integer
        nextCursor:
          type: string
          nullable: true
    Error:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code (e.g. UNAUTHORIZED, NOT_FOUND)
        requestId:
          type: string
          description: Unique request ID for support debugging
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            issues:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    BillingStatus:
      type: object
      properties:
        accountId: *a1
        plan:
          $ref: "#/components/schemas/Plan"
        interval:
          type:
            - string
            - "null"
          enum:
            - month
            - year
            - null
        status:
          type: string
          enum:
            - active
            - trialing
            - expired
            - not_started
        canWrite: *a3
        configured: *a3
        usage:
          type: object
        limits:
          type: object
        pendingPlan:
          type:
            - string
            - "null"
        pendingInterval:
          type:
            - string
            - "null"
        trialEndsAt:
          type:
            - integer
            - "null"
        paidThrough:
          type:
            - integer
            - "null"
        cancelAtPeriodEnd: *a3
        hasSubscription: *a3
        hasBillingCustomer: *a3
        providerStatus: *a4
    AgentInput:
      type: object
      required:
        - postId
        - profile
        - prompt
      properties:
        postId: *a1
        profile:
          type: string
          enum:
            - writing
            - seo
            - linking
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
    LinkEntry:
      type: object
      properties:
        id: *a1
        postId: *a1
        url: *a1
        anchor: *a1
        kind: *a1
        status:
          type: string
          enum: *a6
        httpStatus:
          type:
            - integer
            - "null"
        finalUrl: *a4
        checkedAt:
          type:
            - integer
            - "null"
        ignored:
          type: integer
          enum:
            - 0
            - 1
        insecure: *a3
    LinkReport:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/LinkEntry"
        scans:
          type: array
          items:
            type: object
            properties:
              id: *a1
              status: *a1
              checked: *a5
              error: *a4
              createdAt: *a5
              completedAt:
                type:
                  - integer
                  - "null"
        orphaned:
          type: array
          items:
            type: object
            properties:
              id: *a1
              title: *a1
              slug: *a1
        nextCursor: *a4
        limited: *a3
