openapi: 3.1.0
info:
  title: BlogStack API
  version: 0.2.0
  description: BlogStack paid launch API. Management requires a verified session or scoped project key. Public
    delivery uses published snapshots only. Billing and AI proposal review require a human session. Legacy
    plan labels never grant paid access.
  contact:
    name: BlogStack Support
    url: https://blogstack-site.hidden-silence-2d18.workers.dev
    url: https://blogstack-site.hidden-silence-2d18.workers.dev/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://blogstack-app.hidden-silence-2d18.workers.dev
    description: Production
  - url: http://localhost:8787
    description: Local development (wrangler dev)
security:
  - cookieAuth: []
  - apiKeyAuth: []
tags:
  - name: accounts
    description: Account management and plan info
  - name: projects
    description: Project CRUD and statistics
  - name: members
    description: Account-level and project-level team management
  - name: invitations
    description: Token-based invitation flow for new collaborators
  - name: posts
    description: Private drafts, previews, explicit publish and unpublish
  - name: media
    description: File upload via presigned R2 URLs
  - name: tags
    description: Post tag management
  - name: api-keys
    description: Programmatic API key management
  - name: public
    description: Unauthenticated public delivery endpoints
  - name: billing
  - name: seo
  - name: links
  - name: analytics
  - name: agent-runs
paths:
  /accounts/me:
    get:
      operationId: getAccount
      summary: Get current account
      description: Returns account details including plan, limits, and owner info.
      tags:
        - accounts
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateAccount
      summary: Update account name
      tags:
        - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /accounts/members:
    get:
      operationId: listAccountMembers
      summary: List all account members
      description: Returns all members under the current account (account_admin and account_editor roles).
      tags:
        - members
      responses:
        "200":
          description: Account members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: inviteAccountMember
      summary: Invite an account member
      description: Creates an invitation for a new account-level member. Requires account_admin or owner role.
      tags:
        - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAccountMemberRequest"
      responses:
        "201":
          description: Invitation created and email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /accounts/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateAccountMember
      summary: Change account member role
      tags:
        - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: "#/components/schemas/AccountRole"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: removeAccountMember
      summary: Remove an account member
      tags:
        - members
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects:
    get:
      operationId: listProjects
      summary: List projects for the current account
      tags:
        - projects
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      summary: Create a project
      description: Creates a blog in the selected billing account. Solo allows one blog. Studio and Growth have no
        numerical blog cap. The first owned blog starts the 14-day Studio trial.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Plan limit reached or insufficient permissions
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get project details
      tags:
        - projects
      responses:
        "200":
          description: Project with settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Update project settings
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Permanently deletes the project and all associated posts, media, and tags. Requires owner or
        account_admin role.
      tags:
        - projects
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/stats:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectStats
      summary: Get project statistics
      tags:
        - projects
      responses:
        "200":
          description: Project statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: List project members
      tags:
        - members
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: inviteProjectMember
      summary: Invite a project member
      description: Sends an email invitation for a project-scoped collaborator. Requires project_admin,
        account_admin, or owner role.
      tags:
        - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteProjectMemberRequest"
      responses:
        "201":
          description: Invitation created and email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateProjectMember
      summary: Change project member role
      tags:
        - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: "#/components/schemas/ProjectRole"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: removeProjectMember
      summary: Remove a project member
      tags:
        - members
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getInvitation
      summary: Look up an invitation by token
      description: Public endpoint — no auth required. Used to show invite details before sign-up.
      tags:
        - invitations
      security: []
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Invitation expired
  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: Creates the project_member or account_member row. Requires user to be signed in first.
      tags:
        - invitations
      responses:
        "200":
          description: Invitation accepted and membership created
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectTo:
                    type: string
                    description: URL to redirect the user to after acceptance
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Invitation expired or already accepted
  /projects/{projectId}/posts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listPosts
      summary: List posts in a project
      tags:
        - posts
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PostStatus"
        - name: tag
          in: query
          description: Filter by tag slug
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search on post title
          schema:
            type: string
        - name: cursor
          in: query
          description: Opaque continuation cursor from nextCursor. Pass back unchanged; timestamp-only cursors are no
            longer accepted.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPosts"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPost
      summary: Create a draft post
      tags:
        - posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Created draft post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PostId"
    get:
      operationId: getPost
      summary: Get a post by ID
      tags:
        - posts
      responses:
        "200":
          description: Post with tags and author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostWithTags"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      summary: Update a post
      description: |
        Writers can only update their own posts.
        Editors and project_admins can update any post in the project.
      tags:
        - posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deletePost
      summary: Delete a post
      tags:
        - posts
      responses:
        "204":
          description: Post and all post_tags deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/posts/{postId}/publish:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PostId"
    post:
      operationId: publishPost
      summary: Publish a post immediately
      description: Render the saved draft before replacing the live snapshot. Optional expected revision rejects
        stale publication.
      tags:
        - posts
      responses:
        "200":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  minimum: 1
  /projects/{projectId}/posts/{postId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PostId"
    post:
      operationId: duplicatePost
      summary: Duplicate a post
      description: Clones the post as a draft with slug suffixed `-copy`.
      tags:
        - posts
      responses:
        "201":
          description: Duplicated post (status=draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/media:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listMedia
      summary: List media in a project
      tags:
        - media
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque continuation cursor from nextCursor. Pass back unchanged; timestamp-only cursors are no
            longer accepted.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Paginated media list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMedia"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/{projectId}/media/presign:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: presignMediaUpload
      summary: Create a signed CDN upload URL
      description: Returns a single-use PUT URL valid for 15 minutes. Upload JPEG, PNG, GIF, WebP or AVIF up to 10
        MiB, then confirm the upload. Uploaded objects are immutable and hidden until confirmed.
      tags:
        - media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - mimeType
              properties:
                filename:
                  type: string
                  maxLength: 255
                mimeType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/gif
                    - image/webp
                    - image/avif
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                type: object
                required:
                  - presignedUrl
                  - mediaId
                  - key
                properties:
                  presignedUrl:
                    type: string
                    format: uri
                    description: PUT this URL with Content-Type matching the requested mimeType
                  mediaId:
                    type: string
                    description: Use in the subsequent /confirm call
                  key:
                    type: string
                    description: R2 object key
                  expiresAt:
                    type: integer
                    description: Expiration as Unix seconds
                  maxSize:
                    type: integer
                    description: Maximum upload size in bytes
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Unsupported MIME type (only image/* allowed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}/media/confirm/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: confirmMediaUpload
      summary: Confirm upload and store media metadata
      description: Send an empty JSON object after uploading. Size and content type are verified from R2; client
        size and dimensions are ignored. Repeated confirmation returns the same media record. Dimensions
        remain null until trusted processing is available.
      tags:
        - media
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                width:
                  type: integer
                height:
                  type: integer
                size:
                  type: integer
                  description: File size in bytes
      responses:
        "200":
          description: Confirmed media record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: R2 upload is missing
  /projects/{projectId}/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteMedia
      summary: Delete a media file
      description: |
        Deletes the file from R2, purges all CDN KV cache variants (all width/format combinations),
        and removes the D1 metadata record.
      tags:
        - media
      responses:
        "204":
          description: Media deleted from R2, CDN cache, and database
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tags:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listTags
      summary: List tags with post count
      tags:
        - tags
      responses:
        "200":
          description: Tags with post counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagWithCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTag
      summary: Create a tag
      tags:
        - tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Tag slug already exists in this project
  /projects/{projectId}/tags/{tagId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: tagId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTag
      summary: Update a tag
      tags:
        - tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteTag
      summary: Delete a tag and all post associations
      tags:
        - tags
      responses:
        "204":
          description: Tag and post_tags deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/tags/merge:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: mergeTags
      summary: Merge one tag into another
      description: Reassigns all post_tags from sourceId to targetId, then deletes the source tag.
      tags:
        - tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceId
                - targetId
              properties:
                sourceId:
                  type: string
                  description: Tag to merge from (will be deleted)
                targetId:
                  type: string
                  description: Tag to merge into (preserved)
      responses:
        "200":
          description: Merge complete — returns the surviving tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagWithCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listApiKeys
      summary: List API keys (prefix + name only, never reveals hash)
      tags:
        - api-keys
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: " Requires a project-admin session; keys cannot manage keys. Creation returns plaintext once.
        Requires a project-admin session; keys cannot manage keys. Creation returns plaintext once. Requires a
        project-admin session; keys cannot manage keys. Creation returns plaintext once."
    post:
      operationId: createApiKey
      summary: Create an API key
      description: >-
        Generates a new `bsk_live_` key. The `plaintext` field in the response is returned

        **exactly once** — it cannot be retrieved again. Store it immediately.
         Requires a project-admin session; keys cannot manage keys. Creation returns plaintext once. Requires a project-admin session; keys cannot manage keys. Creation returns plaintext once. Requires a project-admin session; keys cannot manage keys. Creation returns plaintext once.
      tags:
        - api-keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Human-readable label for this key
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - projects:read
                      - posts:read
                      - posts:write
                      - media:read
                      - media:write
                      - tags:read
                      - tags:write
                expiresAt:
                  type: integer
                  description: Optional future Unix timestamp in seconds
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    properties:
                      plaintext: &a1
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: keyId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteApiKey
      summary: Revoke an API key
      tags:
        - api-keys
